<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SortBot — Vision Sorting System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap');
  :root{--bg:#12120f;--bg2:#1a1a17;--bg3:#222220;--white:#f0f0eb;--muted:#7a7872;--green:#1d9e75;--green-dim:#0d4a36;--red:#e24b4a;--red-dim:#5a1a1a;--amber:#ef9f27;--blue:#378add;--blue-dim:#0e2d52;--purple:#7f77dd;--purple-dim:#2a2356;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--white);font-family:'Barlow',sans-serif;overflow:hidden;height:100vh;width:100vw;}
  #menu{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
  #menu.hidden{display:none;}
  .menu-logo{font-family:'Share Tech Mono',monospace;font-size:clamp(28px,4vw,52px);letter-spacing:.05em;}
  .menu-logo span{color:var(--green);}
  .menu-sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:5px;margin-bottom:22px;}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bg3);border:1px solid var(--bg3);width:min(480px,90vw);}
  .menu-cell{background:var(--bg2);padding:16px 18px;display:flex;flex-direction:column;gap:8px;}
  .menu-cell label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .opt-row{display:flex;gap:5px;flex-wrap:wrap;}
  .opt-btn{background:var(--bg3);border:1px solid #333;color:var(--muted);font-family:'Barlow',sans-serif;font-size:12px;font-weight:600;padding:4px 12px;cursor:pointer;transition:all .15s;letter-spacing:.04em;}
  .opt-btn:hover{border-color:var(--muted);color:var(--white);}
  .opt-btn.active{background:var(--green-dim);border-color:var(--green);color:var(--green);}
  #start-btn{margin-top:18px;background:var(--green);border:none;color:#000;font-family:'Barlow',sans-serif;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:13px 52px;cursor:pointer;transition:all .15s;width:min(480px,90vw);}
  #start-btn:hover{background:#24bf8d;}
  .acc-table{margin-top:20px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);line-height:2;text-align:center;}
  #game-wrap{position:absolute;inset:0;display:none;}
  #game-wrap.active{display:block;}
  canvas{display:block;width:100%;height:100%;}
  #pause-overlay{position:absolute;inset:0;background:rgba(18,18,15,.5);display:none;align-items:center;justify-content:center;z-index:50;font-family:'Share Tech Mono',monospace;font-size:36px;color:var(--amber);letter-spacing:.2em;pointer-events:none;}
  #pause-overlay.active{display:flex;}
  #end-screen{position:absolute;inset:0;background:rgba(18,18,15,.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;}
  #end-screen.active{display:flex;}
  .end-title{font-family:'Share Tech Mono',monospace;font-size:24px;color:var(--green);letter-spacing:.1em;margin-bottom:6px;}
  .end-score{font-family:'Share Tech Mono',monospace;font-size:54px;color:var(--white);line-height:1;}
  .end-sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;margin-bottom:20px;}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bg3);border:1px solid var(--bg3);margin-bottom:18px;width:min(560px,92vw);}
  .stat-cell{background:var(--bg2);padding:12px 16px;text-align:center;}
  .stat-cell .s-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
  .stat-cell .s-val{font-family:'Share Tech Mono',monospace;font-size:20px;color:var(--white);}
  .per-class-grid{width:min(560px,92vw);display:flex;flex-direction:column;gap:4px;margin-bottom:20px;max-height:200px;overflow-y:auto;}
  .cls-row{display:flex;align-items:center;gap:8px;font-family:'Share Tech Mono',monospace;font-size:11px;}
  .cls-name{width:88px;color:var(--muted);}
  .cls-bar-bg{flex:1;height:5px;background:var(--bg3);}
  .cls-bar{height:100%;transition:width .6s;}
  .cls-pct{width:38px;text-align:right;color:var(--white);}
  #restart-btn{background:transparent;border:1px solid var(--green);color:var(--green);font-family:'Barlow',sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:11px 40px;cursor:pointer;transition:all .15s;}
  #restart-btn:hover{background:var(--green);color:#000;}
</style>
</head>
<body>

<div id="menu">
  <div class="menu-logo">Sort<span>Bot</span></div>
  <div class="menu-sub">Vision-Based Sorting System</div>
  <div class="menu-grid">
    <div class="menu-cell"><label>Classifier</label>
      <div class="opt-row" id="clf-opts">
        <button class="opt-btn active" data-val="color">COLOR</button>
        <button class="opt-btn" data-val="hog">HOG</button>
        <button class="opt-btn" data-val="ml">ML</button>
      </div></div>
    <div class="menu-cell"><label>Belt Speed</label>
      <div class="opt-row" id="speed-opts">
        <button class="opt-btn" data-val="1">1</button>
        <button class="opt-btn active" data-val="2">2</button>
        <button class="opt-btn" data-val="3">3</button>
        <button class="opt-btn" data-val="4">4</button>
        <button class="opt-btn" data-val="5">5</button>
      </div></div>
    <div class="menu-cell"><label>Noise Level</label>
      <div class="opt-row" id="noise-opts">
        <button class="opt-btn active" data-val="0">OFF</button>
        <button class="opt-btn" data-val="1">1</button>
        <button class="opt-btn" data-val="2">2</button>
        <button class="opt-btn" data-val="3">3</button>
        <button class="opt-btn" data-val="4">4</button>
      </div></div>
    <div class="menu-cell"><label>Batch Size</label>
      <div class="opt-row" id="batch-opts">
        <button class="opt-btn" data-val="20">20</button>
        <button class="opt-btn active" data-val="40">40</button>
        <button class="opt-btn" data-val="60">60</button>
        <button class="opt-btn" data-val="80">80</button>
      </div></div>
  </div>
  <button id="start-btn">START SESSION</button>
  <div class="acc-table">COLOR ~72% · 8–18ms &nbsp;|&nbsp; HOG ~83% · 22–40ms &nbsp;|&nbsp; ML ~94% · 55–95ms</div>
</div>

<div id="game-wrap"><canvas id="canvas"></canvas></div>
<div id="pause-overlay">PAUSED</div>
<div id="end-screen">
  <div class="end-title">SESSION COMPLETE</div>
  <div class="end-score" id="end-score">0</div>
  <div class="end-sub">points</div>
  <div class="stats-grid">
    <div class="stat-cell"><div class="s-label">Sorted</div><div class="s-val" id="es-sorted">0</div></div>
    <div class="stat-cell"><div class="s-label">Accuracy</div><div class="s-val" id="es-acc">0%</div></div>
    <div class="stat-cell"><div class="s-label">Best Streak</div><div class="s-val" id="es-streak">0</div></div>
    <div class="stat-cell"><div class="s-label">Avg Latency</div><div class="s-val" id="es-lat">0ms</div></div>
  </div>
  <div class="per-class-grid" id="per-class-grid"></div>
  <button id="restart-btn">PLAY AGAIN</button>
</div>

<script>
// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const CLASSES=['airplane','automobile','bird','cat','deer','dog','frog','horse','ship','truck'];
const TO_BIN={airplane:'recycle',automobile:'recycle',bird:'organic',cat:'organic',deer:'organic',dog:'organic',frog:'organic',horse:'organic',ship:'metal',truck:'metal'};
const DEFECT=new Set(['frog','deer']);
const getBin=c=>DEFECT.has(c)?'reject':(TO_BIN[c]||'reject');
const CLF_ACC={color:.72,hog:.83,ml:.94};
const NOISE_PEN=[0,.06,.14,.24,.38];
const LAT_MS={color:[8,18],hog:[22,40],ml:[55,95]};
const BIN_COL={recycle:'#378add',organic:'#1d9e75',metal:'#7f77dd',reject:'#e24b4a'};
const BIN_DIM={recycle:'#0a2040',organic:'#082e20',metal:'#1a1840',reject:'#3a1010'};
const BIN_LBL={recycle:'♻ Recycle',organic:'🌿 Organic',metal:'⚙ Metal',reject:'✕ Reject'};
const TO_BIN={airplane:'metal',automobile:'metal',bird:'organic',cat:'organic',deer:'organic',dog:'organic',frog:'organic',horse:'organic',ship:'metal',truck:'metal'};
const REASONING={
  airplane:['long swept wings detected','thin symmetrical fuselage','high-altitude silhouette'],
  automobile:['wheel arch contours','compact rectangular body','low ground clearance'],
  bird:['small lightweight body','wing-spread outline','bright plumage color regions'],
  cat:['pointed ear triangles','round face geometry','small compact body ratio'],
  deer:['antler branch structures','long slender legs','brown earth-tone dominant'],
  dog:['snout protrusion detected','four-leg silhouette','floppy ear regions'],
  frog:['large protruding eyes','wide squat body','green dominant hue'],
  horse:['elongated body mass','tall leg-to-body ratio','mane ridge along back'],
  ship:['flat wide hull base','large rectangular superstructure','watercraft profile'],
  truck:['large cargo body mass','strong vertical edges','multi-axle wheel pattern']
};

// ═══════════════════════════════════════════════
// IMAGE GENERATOR — recognisable pixel-art per class
// ═══════════════════════════════════════════════
const IMG_CACHE={};
function makeImg(cls){
  if(IMG_CACHE[cls]) return IMG_CACHE[cls];
  const SZ=64;
  const c=document.createElement('canvas');
  c.width=c.height=SZ;
  const g=c.getContext('2d');
  const cx=SZ/2, cy=SZ/2;

  // background gradients per class
  const bgs={
    airplane:['#7aa8d8','#4470a8'],automobile:['#c85050','#902828'],
    bird:['#70a870','#3a7040'],cat:['#c8a060','#906028'],
    deer:['#b09050','#785820'],dog:['#c09050','#885830'],
    frog:['#38a838','#1a6a1a'],horse:['#785030','#4a2810'],
    ship:['#4880c0','#1a4880'],truck:['#c07030','#804020'],
  };
  const [c1,c2]=bgs[cls]||['#666','#333'];
  const gr=g.createLinearGradient(0,0,SZ,SZ);
  gr.addColorStop(0,c1); gr.addColorStop(1,c2);
  g.fillStyle=gr; g.fillRect(0,0,SZ,SZ);

  // subtle noise
  const id=g.getImageData(0,0,SZ,SZ);
  for(let i=0;i<id.data.length;i+=4){
    const n=(Math.random()-.5)*18;
    id.data[i]=Math.max(0,Math.min(255,id.data[i]+n));
    id.data[i+1]=Math.max(0,Math.min(255,id.data[i+1]+n));
    id.data[i+2]=Math.max(0,Math.min(255,id.data[i+2]+n));
  }
  g.putImageData(id,0,0);

  g.save(); g.translate(cx,cy);

  ({
    airplane(){
      // fuselage
      g.fillStyle='#e8eef8';
      g.beginPath(); g.ellipse(0,0,22,7,0,0,Math.PI*2); g.fill();
      // wings
      g.fillStyle='#c0d0e8';
      g.beginPath(); g.moveTo(-5,-4); g.lineTo(-22,14); g.lineTo(8,4); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-5,4); g.lineTo(-22,-14); g.lineTo(8,-4); g.closePath(); g.fill();
      // tail fin
      g.fillStyle='#a8c0d8';
      g.beginPath(); g.moveTo(16,-2); g.lineTo(24,-12); g.lineTo(24,0); g.closePath(); g.fill();
      // cockpit window
      g.fillStyle='#90d8f8';
      g.beginPath(); g.ellipse(-10,0,6,5,0,0,Math.PI*2); g.fill();
      // engine
      g.fillStyle='#d0d8e8';
      g.beginPath(); g.ellipse(-2,10,3,6,0,0,Math.PI*2); g.fill();
    },
    automobile(){
      // body lower
      g.fillStyle='#e83030';
      g.beginPath(); g.roundRect(-20,2,40,14,4); g.fill();
      // body upper
      g.fillStyle='#c81818';
      g.beginPath(); g.roundRect(-14,-12,28,15,6); g.fill();
      // windshield
      g.fillStyle='#90d0f8';
      g.beginPath(); g.roundRect(-11,-10,12,10,2); g.fill();
      // rear window
      g.beginPath(); g.roundRect(2,-10,10,10,2); g.fill();
      // wheels
      [[-13,16],[13,16]].forEach(([wx,wy])=>{
        g.fillStyle='#1a1a1a'; g.beginPath(); g.arc(wx,wy,7,0,Math.PI*2); g.fill();
        g.fillStyle='#606060'; g.beginPath(); g.arc(wx,wy,3.5,0,Math.PI*2); g.fill();
        g.fillStyle='#909090'; g.beginPath(); g.arc(wx,wy,1.5,0,Math.PI*2); g.fill();
      });
      // headlights
      g.fillStyle='#ffee80'; g.fillRect(-22,4,5,4);
      g.fillStyle='#ff8888'; g.fillRect(18,4,4,4);
      // door line
      g.strokeStyle='#a01010'; g.lineWidth=1.2;
      g.beginPath(); g.moveTo(-2,-8); g.lineTo(-2,14); g.stroke();
    },
    bird(){
      // body
      g.fillStyle='#e06020';
      g.beginPath(); g.ellipse(4,4,16,11,-.2,0,Math.PI*2); g.fill();
      // head
      g.fillStyle='#f07030';
      g.beginPath(); g.arc(-12,-10,10,0,Math.PI*2); g.fill();
      // wing
      g.fillStyle='#b84010';
      g.beginPath(); g.moveTo(4,-2); g.lineTo(24,-14); g.lineTo(20,8); g.closePath(); g.fill();
      g.fillStyle='#d05018';
      g.beginPath(); g.moveTo(4,-2); g.lineTo(18,-10); g.lineTo(14,6); g.closePath(); g.fill();
      // tail
      g.fillStyle='#a03808';
      g.beginPath(); g.moveTo(18,8); g.lineTo(28,14); g.lineTo(20,16); g.closePath(); g.fill();
      // eye
      g.fillStyle='#111'; g.beginPath(); g.arc(-14,-12,3,0,Math.PI*2); g.fill();
      g.fillStyle='#fff'; g.beginPath(); g.arc(-15,-13,1.2,0,Math.PI*2); g.fill();
      // beak
      g.fillStyle='#f0c020';
      g.beginPath(); g.moveTo(-21,-9); g.lineTo(-28,-7); g.lineTo(-21,-4); g.closePath(); g.fill();
    },
    cat(){
      // body
      g.fillStyle='#c8a060';
      g.beginPath(); g.ellipse(2,10,16,13,0,0,Math.PI*2); g.fill();
      // head
      g.beginPath(); g.arc(-2,-8,15,0,Math.PI*2); g.fill();
      // ears
      g.fillStyle='#b08040';
      g.beginPath(); g.moveTo(-16,-20); g.lineTo(-22,-32); g.lineTo(-6,-22); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(10,-20); g.lineTo(18,-32); g.lineTo(6,-22); g.closePath(); g.fill();
      g.fillStyle='#e09090';
      g.beginPath(); g.moveTo(-15,-22); g.lineTo(-20,-30); g.lineTo(-7,-24); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(10,-22); g.lineTo(16,-30); g.lineTo(7,-24); g.closePath(); g.fill();
      // eyes
      g.fillStyle='#48c048';
      [-7,5].forEach(ex=>{ g.beginPath(); g.ellipse(ex,-8,5,4,0,0,Math.PI*2); g.fill(); });
      g.fillStyle='#111';
      [-7,5].forEach(ex=>{ g.beginPath(); g.ellipse(ex,-8,2,4,0,0,Math.PI*2); g.fill(); });
      g.fillStyle='rgba(255,255,255,.5)';
      [-7,5].forEach(ex=>{ g.beginPath(); g.arc(ex-1,-9,1.2,0,Math.PI*2); g.fill(); });
      // nose
      g.fillStyle='#e05878'; g.beginPath(); g.arc(-2,-2,3,0,Math.PI*2); g.fill();
      // whiskers
      g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=.9;
      [[-1,-1],[-1,-3],[1,-1],[1,-3]].forEach(([dx,dy])=>{
        g.beginPath(); g.moveTo(dx*2,dy*2); g.lineTo(dx*18,dy*4); g.stroke();
      });
      // tail
      g.strokeStyle='#b08040'; g.lineWidth=4; g.lineCap='round';
      g.beginPath(); g.moveTo(16,18); g.quadraticCurveTo(28,10,24,-4); g.stroke();
      g.lineCap='butt';
    },
    deer(){
      // body
      g.fillStyle='#9a6830';
      g.beginPath(); g.ellipse(2,8,16,12,0,0,Math.PI*2); g.fill();
      // neck
      g.beginPath(); g.ellipse(-6,-4,8,12,.4,0,Math.PI*2); g.fill();
      // head
      g.beginPath(); g.ellipse(-10,-16,10,8,.2,0,Math.PI*2); g.fill();
      // antlers
      g.strokeStyle='#6a4018'; g.lineWidth=2.5; g.lineCap='round';
      // left antler
      g.beginPath(); g.moveTo(-14,-23); g.lineTo(-18,-34); g.stroke();
      g.beginPath(); g.moveTo(-18,-30); g.lineTo(-24,-26); g.stroke();
      g.beginPath(); g.moveTo(-16,-32); g.lineTo(-12,-27); g.stroke();
      // right antler
      g.beginPath(); g.moveTo(-6,-23); g.lineTo(-4,-34); g.stroke();
      g.beginPath(); g.moveTo(-4,-30); g.lineTo(2,-26); g.stroke();
      g.beginPath(); g.moveTo(-5,-32); g.lineTo(-9,-27); g.stroke();
      g.lineCap='butt';
      // legs
      g.fillStyle='#7a5020';
      [[-8,18],[-2,18],[6,18],[12,18]].forEach(([lx,ly])=>g.fillRect(lx-2.5,ly,5,14));
      // white belly
      g.fillStyle='rgba(255,240,200,.4)';
      g.beginPath(); g.ellipse(2,12,8,7,0,0,Math.PI*2); g.fill();
      // eye
      g.fillStyle='#111'; g.beginPath(); g.arc(-13,-18,2.5,0,Math.PI*2); g.fill();
      g.fillStyle='rgba(255,255,255,.6)'; g.beginPath(); g.arc(-14,-19,1,0,Math.PI*2); g.fill();
    },
    dog(){
      // body
      g.fillStyle='#c08848';
      g.beginPath(); g.ellipse(4,6,17,12,0,0,Math.PI*2); g.fill();
      // head
      g.beginPath(); g.ellipse(-6,-8,14,12,0,0,Math.PI*2); g.fill();
      // ears (floppy)
      g.fillStyle='#a07030';
      g.beginPath(); g.ellipse(-18,-8,6,11,-.3,0,Math.PI*2); g.fill();
      g.beginPath(); g.ellipse(6,-14,6,9,.3,0,Math.PI*2); g.fill();
      // snout
      g.fillStyle='#d8a870';
      g.beginPath(); g.ellipse(-6,-2,8,6,0,0,Math.PI*2); g.fill();
      // nose
      g.fillStyle='#222'; g.beginPath(); g.arc(-6,-3,4,0,Math.PI*2); g.fill();
      g.fillStyle='#555'; g.beginPath(); g.arc(-6,-3,2,0,Math.PI*2); g.fill();
      // eyes
      g.fillStyle='#3a2010';
      [-12,2].forEach(ex=>{ g.beginPath(); g.arc(ex,-12,4,0,Math.PI*2); g.fill(); });
      g.fillStyle='rgba(255,255,255,.5)';
      [-12,2].forEach(ex=>{ g.beginPath(); g.arc(ex-1,-13,1.5,0,Math.PI*2); g.fill(); });
      // tail
      g.strokeStyle='#c08848'; g.lineWidth=5; g.lineCap='round';
      g.beginPath(); g.moveTo(20,0); g.quadraticCurveTo(30,-12,26,-22); g.stroke();
      // legs
      g.fillStyle='#a07030';
      [[-10,16],[-2,16],[10,16],[18,16]].forEach(([lx,ly])=>g.fillRect(lx-3,ly,6,12));
      g.lineCap='butt';
    },
    frog(){
      // body
      g.fillStyle='#28a828';
      g.beginPath(); g.ellipse(0,6,20,16,0,0,Math.PI*2); g.fill();
      // head
      g.beginPath(); g.ellipse(0,-10,18,12,0,0,Math.PI*2); g.fill();
      // eye bumps
      g.fillStyle='#38c038';
      [-11,11].forEach(ex=>{ g.beginPath(); g.arc(ex,-20,8,0,Math.PI*2); g.fill(); });
      // pupils
      g.fillStyle='#0a1f0a';
      [-11,11].forEach(ex=>{ g.beginPath(); g.arc(ex,-20,4,0,Math.PI*2); g.fill(); });
      g.fillStyle='rgba(255,255,255,.5)';
      [-11,11].forEach(ex=>{ g.beginPath(); g.arc(ex-1,-21,1.5,0,Math.PI*2); g.fill(); });
      // mouth smile
      g.strokeStyle='#1a6a1a'; g.lineWidth=2;
      g.beginPath(); g.arc(0,-8,10,.15,Math.PI-.15); g.stroke();
      // belly
      g.fillStyle='#80e880'; g.beginPath(); g.ellipse(0,8,12,10,0,0,Math.PI*2); g.fill();
      // back legs
      g.fillStyle='#209020';
      g.beginPath(); g.moveTo(-18,14); g.lineTo(-30,26); g.lineTo(-26,30); g.lineTo(-14,20); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(18,14); g.lineTo(30,26); g.lineTo(26,30); g.lineTo(14,20); g.closePath(); g.fill();
      // front arms
      g.beginPath(); g.moveTo(-18,0); g.lineTo(-28,8); g.lineTo(-24,12); g.lineTo(-14,6); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(18,0); g.lineTo(28,8); g.lineTo(24,12); g.lineTo(14,6); g.closePath(); g.fill();
    },
    horse(){
      // body
      g.fillStyle='#603818';
      g.beginPath(); g.ellipse(4,4,20,12,0,0,Math.PI*2); g.fill();
      // neck
      g.beginPath(); g.ellipse(-12,-6,8,14,-.5,0,Math.PI*2); g.fill();
      // head
      g.beginPath(); g.ellipse(-20,-18,10,8,-.3,0,Math.PI*2); g.fill();
      // mane
      g.fillStyle='#301808';
      for(let i=0;i<6;i++){

      // hooves

      // eye

      g.fillStyle='rgba(255,255,255,.5)'; g.beginPath(); g.arc(-23,-21,1.2,0,Math.PI*2); g.fill();
      // nostril

      g.beginPath(); g.moveTo(24,0); g.quadraticCurveTo(32,10,28,24); g.stroke();
      g.lineCap='butt';
    },
    ship(){

      g.fillRect(-30,18,60,14);

      g.beginPath(); g.moveTo(-24,6); g.lineTo(24,6); g.lineTo(20,20); g.lineTo(-20,20); g.closePath(); g.fill();
      // hull stripe
      g.fillStyle='#2050a0';
      g.fillRect(-22,14,44,4);
      // deck
      g.fillStyle='#5080c0'; g.fillRect(-22,0,44,8);
      // superstructure
      g.fillStyle='#e8e0c8'; g.beginPath(); g.roundRect(-6,-16,22,18,2); g.fill();
      g.fillStyle='#d8d0b8'; g.beginPath(); g.roundRect(4,-24,10,10,2); g.fill();
      // funnel
      g.fillStyle='#c82020'; g.fillRect(6,-28,6,8);
      g.fillStyle='#a01010'; g.fillRect(5,-30,8,4);
      // smoke puffs
      g.fillStyle='rgba(200,200,200,.45)';
      [8,10,7].forEach((r,i)=>{ g.beginPath(); g.arc(9,-32-i*6,r,0,Math.PI*2); g.fill(); });
      // windows
      g.fillStyle='#a0d8f8';
      [-2,6].forEach(wx=>{ g.fillRect(wx,-13,5,5); });
      // porthole
      g.strokeStyle='#6090c0'; g.lineWidth=1.5;
      [-14,-8,-2].forEach(px=>{ g.beginPath(); g.arc(px,4,3,0,Math.PI*2); g.stroke(); });
    },
    truck(){
      // trailer
      g.fillStyle='#b06028'; g.beginPath(); g.roundRect(-28,-12,20,24,2); g.fill();
      // trailer ribs
      g.strokeStyle='#904818'; g.lineWidth=1.2;
      [-20,-14,-8].forEach(lx=>{ g.beginPath(); g.moveTo(lx,-10); g.lineTo(lx,10); g.stroke(); });
      // cab
      g.fillStyle='#d07030'; g.beginPath(); g.roundRect(-8,-16,22,28,4); g.fill();
      // windshield
      g.fillStyle='#88c8f0'; g.beginPath(); g.roundRect(-6,-14,18,12,3); g.fill();
      // windshield tint
      g.fillStyle='rgba(0,80,150,.2)'; g.beginPath(); g.roundRect(-6,-14,18,12,3); g.fill();
      // cabin top light bar
      g.fillStyle='#ff4444'; g.fillRect(-2,-18,14,3);
      // door line
      g.strokeStyle='#b06020'; g.lineWidth=1.2;
      g.beginPath(); g.moveTo(-8,-12); g.lineTo(-8,10); g.stroke();
      // headlight
      g.fillStyle='#ffee80'; g.fillRect(12,-8,5,5);
      // wheels
      [[-20,14],[-8,14],[6,14]].forEach(([wx,wy])=>{
        g.fillStyle='#1a1a1a'; g.beginPath(); g.arc(wx,wy,7,0,Math.PI*2); g.fill();
        g.fillStyle='#555'; g.beginPath(); g.arc(wx,wy,3.5,0,Math.PI*2); g.fill();
        g.fillStyle='#888'; g.beginPath(); g.arc(wx,wy,1.5,0,Math.PI*2); g.fill();
      });
      // exhaust pipe
      g.strokeStyle='#808080'; g.lineWidth=2.5; g.lineCap='round';
      g.beginPath(); g.moveTo(-6,-16); g.lineTo(-6,-24); g.stroke();
      g.fillStyle='rgba(180,180,180,.4)';
      g.beginPath(); g.arc(-6,-28,3,0,Math.PI*2); g.fill();
      g.beginPath(); g.arc(-8,-34,2,0,Math.PI*2); g.fill();
      g.lineCap='butt';
    },
  }[cls]||function(){})();

  g.restore();
  IMG_CACHE[cls]=c;
  return c;
}

// ═══════════════════════════════════════════════
// VISION PIPELINE
// ═══════════════════════════════════════════════
class Pipeline{
  constructor(clf,noise){this.clf=clf;this.noise=noise;this.lats=[];this.n=0;}
  effAcc(){return Math.max(.25,CLF_ACC[this.clf]-NOISE_PEN[this.noise]);}
  avgLat(){return this.lats.length?(this.lats.reduce((a,b)=>a+b)/this.lats.length).toFixed(1):'0';}
  process(cls){
    const t0=performance.now();
    const log=['Capturing object image','Reducing image size for fast scanning'];
    if(this.noise>0) log.push('Image contains visual noise — compensating');
    if(this.noise>=2) log.push('Applying edge-preserving noise filter');
    let pred,conf;
    if(this.clf==='color'){
      log.push('Analyzing dominant colors','Searching for color regions','Comparing colors with known objects');
      const map={airplane:.68,automobile:.65,ship:.64,truck:.66,frog:.62,horse:.60,bird:.58,cat:.55,dog:.52,deer:.54};
      conf=map[cls]||.5; pred=cls;
    } else if(this.clf==='hog'){
      log.push('Detecting important edges','Finding outlines and shapes','Comparing object silhouette');
      const map={airplane:.77,automobile:.80,ship:.82,truck:.79,frog:.78,horse:.76,bird:.74,cat:.72,dog:.71,deer:.73};
      conf=map[cls]||.72; pred=cls;
    } else {
      log.push('Neural network analyzing patterns','Comparing against learned examples','Calculating prediction confidence');
      conf=.80+Math.random()*.14; pred=cls;
    }
    const acc=this.effAcc();
    if(Math.random()>acc){
      const w=CLASSES.filter(c=>c!==cls);
      pred=w[Math.floor(Math.random()*w.length)];
      conf=.35+Math.random()*.25;
      log.push('Low confidence — prediction uncertain');
    }
    log.push(`Prediction: ${pred}`);
    const [lo,hi]=LAT_MS[this.clf];
    const lat=(performance.now()-t0)+lo+Math.random()*(hi-lo);
    this.lats.push(lat); this.n++;
    return{prediction:pred,predictedBin:getBin(pred),correctBin:getBin(cls),
           isCorrect:getBin(pred)===getBin(cls),confidence:conf,latencyMs:lat.toFixed(1),
           stageLog:log,reasoning:REASONING[pred]||[]};
  }
}

// ═══════════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════════
function rr(g,x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}

class Game{
  constructor(cv,opts){
    this.cv=cv; this.g=cv.getContext('2d'); this.opts=opts;
    this.pipe=new Pipeline(opts.classifier,opts.noiseLevel);
    this.spd=opts.beltSpeed;
    this._resize();

    // Pre-render all 10 class images at start
    CLASSES.forEach(c=>makeImg(c));

    this.batch=Array.from({length:opts.batchSize},()=>{
      const cls=CLASSES[Math.floor(Math.random()*CLASSES.length)];
      return{cls,img:makeImg(cls)};
    });

    this.items=[];this.iIdx=0;this.spT=0;
    this.score=0;this.streak=0;this.best=0;
    this.total=0;this.correct=0;
    this.pc=Object.fromEntries(CLASSES.map(c=>[c,[0,0]]));
    this.paused=false;this.done=false;
    this.bOff=0;this.pLog=['Initialising…'];this.fb=[];
    this.aAng=0;this.aTgt=0;this.scanPause=0;
    this.lastResult=null;this.lastResultImg=null;
    this.lastT=null;this.raf=null;

    this._kb=e=>this._key(e);
    window.addEventListener('keydown',this._kb);
    window.addEventListener('resize',()=>this._resize());
  }

  _resize(){
    this.cv.width=this.cv.offsetWidth;
    this.cv.height=this.cv.offsetHeight;
    this.W=this.cv.width; this.H=this.cv.height;

    // Scale entire 800×580 logical space to fit screen
    // Layout zones (logical coords, scaled):
    // 0–50:   header
    // 50–310: belt area (belt centre at 200)
    // 310–420: bins
    // 420–580: log + stats panels
    const s=Math.min(this.W/800,this.H/580);
    this.s=s;
    this.BY=Math.round(185*s);   // belt centre Y
    this.BH=Math.round(80*s);    // belt height
    this.SX=Math.round(470*s);   // scan X
    this.IS=Math.round(60*s);    // item size (px)
    this.BINY=Math.round(365*s); // bin centre Y
    this.BINW=Math.round(105*s); // bin width
    this.BINH=Math.round(72*s);  // bin height
    this.PY=Math.round(455*s);   // panels Y
    this.PH=Math.round(108*s);   // panels height
    this.LW=Math.round(370*s);   // log panel width
    this.SX2=Math.round(395*s);  // stats panel X
  }

  start(){this.lastT=performance.now();this.raf=requestAnimationFrame(t=>this._loop(t));}
  stop(){if(this.raf)cancelAnimationFrame(this.raf);window.removeEventListener('keydown',this._kb);}

  _key(e){
    if(e.code==='Space'){e.preventDefault();this.paused=!this.paused;document.getElementById('pause-overlay').classList.toggle('active',this.paused);}
    if(e.key==='q'||e.key==='Q'||e.key==='Escape')this._end();
    if('12345'.includes(e.key))this.spd=+e.key;
  }

  _loop(now){
    const dt=Math.min((now-this.lastT)/1000,.1);this.lastT=now;
    if(!this.paused&&!this.done)this._update(dt);
    this._draw();
    if(!this.done)this.raf=requestAnimationFrame(t=>this._loop(t));
  }

  _update(dt){
    if(this.scanPause>0){this.scanPause-=dt;this._draw();return;}
    const mv=this.spd*68*dt*this.s;
    this.bOff=(this.bOff+mv)%38;

    if(this.iIdx<this.batch.length){
      this.spT+=dt;
      const gap=Math.max(.65,1.9-this.spd*.18);
      if(this.spT>=gap){this._spawn();this.spT=0;}
    }

    for(const it of this.items){
      it.x-=mv;it.age+=dt;
      if(it.ft>0)it.ft-=dt;else if(it.ft<0)it.ft+=dt;
      if(!it.clf&&it.x<=this.SX){
        it.clf=true;this.scanPause=1.1;
        this.pLog=['Stage 1: frame captured','Stage 2: preprocessing…'];
        const r=this.pipe.process(it.cls);
        setTimeout(()=>this._apply(it,r),80+Math.random()*100);
      }
    }
    this.items=this.items.filter(i=>i.x>-110);
    this.aAng+=(this.aTgt-this.aAng)*Math.min(1,dt*6);
    this.fb=this.fb.filter(f=>f.a>0);
    for(const f of this.fb){f.a-=dt*1.4;f.dy-=dt*26;}

    if(this.iIdx>=this.batch.length&&this.items.length===0){
      this.done=true;setTimeout(()=>this._end(),1500);
    }
  }

  _spawn(){
    const{cls,img}=this.batch[this.iIdx++];
    this.items.push({cls,img,x:this.W+this.IS,clf:false,result:null,age:0,ft:0});
  }

  _apply(it,res){
    it.result=res;this.total++;this.pc[it.cls][1]++;
    if(res.isCorrect){
      this.correct++;this.streak++;this.best=Math.max(this.best,this.streak);
      const pts=10+this.streak*2;this.score+=pts;
      this.pc[it.cls][0]++;it.ft=.45;
      this.fb.push({text:`+${pts}`,x:it.x,y:this.BY-this.BH/2-16*this.s,color:'#1d9e75',a:1,dy:0});
    } else {
      this.streak=0;it.ft=-.45;
      this.fb.push({text:'ERR',x:it.x,y:this.BY-this.BH/2-16*this.s,color:'#e24b4a',a:1,dy:0});
    }
    const bins=['recycle','organic','metal','reject'];
    this.aTgt=[-45,-15,15,45][bins.indexOf(res.predictedBin)]??0;
    this.pLog=['AI scanner active',...res.stageLog.slice(-5)];
    this.lastResult=res;
    this.lastResultImg=it.img;
  }

  _draw(){
    const{g,W,H}=this;
    g.clearRect(0,0,W,H);
    g.fillStyle='#12120f';g.fillRect(0,0,W,H);
    this._dHeader();this._dBelt();this._dItems();
    this._dScan();this._dArm();this._dBins();
    this._dLog();this._dStats();this._dFb();
    this._dAnalysisPanel();
    this._dHint();
  }

  _dAnalysisPanel(){
    const{g,s,W,H}=this;
    const res=this.lastResult; const img=this.lastResultImg;
    if(!res||!img) return;
    const pw=220*s,ph=190*s,px=W-pw-10*s,py=10*s;
    // panel bg
    g.fillStyle='#0e0e12';rr(g,px,py,pw,ph,8*s);g.fill();
    g.strokeStyle='#2a2a40';g.lineWidth=1;rr(g,px,py,pw,ph,8*s);g.stroke();
    // header
    g.font=`700 ${9*s}px 'Share Tech Mono',monospace`;g.fillStyle='#1d9e75';
    g.fillText('AI ANALYSIS',px+10*s,py+16*s);
    // thumbnail
    const ts=62*s;
    g.drawImage(img,px+10*s,py+24*s,ts,ts);
    // fake edge overlay on thumbnail
    g.save();g.globalAlpha=0.18;g.strokeStyle='#fff';g.lineWidth=1;
    for(let i=0;i<10;i++){
      g.beginPath();
      g.moveTo(px+10*s,py+24*s+i*6.5*s);
      g.lineTo(px+10*s+ts,py+24*s+i*5*s);
      g.stroke();
    }
    g.restore();
    // confidence bar
    const bx=px+10*s,by=py+92*s,bw=200*s,bh=6*s;
    g.fillStyle='#1e1e28';g.fillRect(bx,by,bw,bh);
    const barCol=res.confidence>.75?'#1d9e75':res.confidence>.5?'#ef9f27':'#e24b4a';
    g.fillStyle=barCol;g.fillRect(bx,by,bw*res.confidence,bh);
    // prediction + confidence text
    g.font=`${9.5*s}px 'Share Tech Mono',monospace`;g.fillStyle='#e8e8e0';
    g.fillText(`Prediction: ${res.prediction}`,bx,py+82*s);
    g.fillText(`Confidence: ${(res.confidence*100).toFixed(0)}%`,bx,py+108*s);
    // reasoning
    g.font=`${8*s}px 'Share Tech Mono',monospace`;g.fillStyle='#44445a';
    g.fillText('WHY THIS PREDICTION:',bx,py+126*s);
    g.fillStyle='#1d9e75';
    (res.reasoning||[]).slice(0,3).forEach((r,i)=>{
      g.fillText(`• ${r}`,bx+4*s,py+140*s+i*16*s);
    });
  }
  }

  _dHeader(){
    const{g,s}=this;
    g.font=`700 ${15*s}px Barlow,sans-serif`;g.fillStyle='#f0f0eb';
    g.fillText('SortBot Vision System',12*s,22*s);
    g.font=`${10*s}px 'Share Tech Mono',monospace`;g.fillStyle='#5a5a62';
    g.fillText(`${this.opts.classifier.toUpperCase()} · noise:${this.opts.noiseLevel} · eff.acc:${(this.pipe.effAcc()*100).toFixed(0)}% · avg latency:${this.pipe.avgLat()}ms`,12*s,38*s);
  }

  _dBelt(){
    const{g,W,BY,BH,bOff,s}=this;
    const top=BY-BH/2;
    // belt body
    g.fillStyle='#1e1e26';g.fillRect(0,top,W,BH);
    // stripes
    g.strokeStyle='#28283a';g.lineWidth=1;
    for(let x=-bOff;x<W;x+=38*s){g.beginPath();g.moveTo(x,top);g.lineTo(x,top+BH);g.stroke();}
    // roller strip top/bottom
    const rh=7*s;
    g.fillStyle='#2a2a38';g.fillRect(0,top,W,rh);g.fillRect(0,top+BH-rh,W,rh);
    // edges
    g.strokeStyle='#4a4a5a';g.lineWidth=1.5;
    g.beginPath();g.moveTo(0,top);g.lineTo(W,top);g.stroke();
    g.beginPath();g.moveTo(0,top+BH);g.lineTo(W,top+BH);g.stroke();
  }

  _dItems(){
    const{g,BY,IS,s}=this;
    for(const it of this.items){
      const x=Math.round(it.x),y=BY,hw=IS/2;
      // glow flash
      if(it.ft!==0){
        const a=Math.min(.6,Math.abs(it.ft)*1.8);
        g.save();g.globalAlpha=a;
        g.fillStyle=it.ft>0?'#1d9e75':'#e24b4a';
        g.fillRect(x-hw-5,y-hw-5,IS+10,IS+10);
        g.restore();
      }
      // drop shadow
      g.save();g.globalAlpha=.25;g.fillStyle='#000';g.fillRect(x-hw+3,y+hw,IS,5);g.restore();
      // draw image
      g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
      g.drawImage(it.img,x-hw,y-hw,IS,IS);
      // border
      g.strokeStyle=it.result?(it.result.isCorrect?'#1d9e75':'#e24b4a'):'#3a3a4a';
      g.lineWidth=2;g.strokeRect(x-hw,y-hw,IS,IS);
      // label pill
      if(it.clf&&it.result){
        const lbl=`${it.result.prediction} ${(it.result.confidence*100).toFixed(0)}%`;
        g.font=`${9.5*s}px 'Share Tech Mono',monospace`;
        const tw=g.measureText(lbl).width;
        g.fillStyle='rgba(10,10,14,.8)';
        rr(g,x-tw/2-4,y-hw-18*s,tw+8,14*s,4);g.fill();
        g.fillStyle='#e8e8e0';g.textAlign='center';
        g.fillText(lbl,x,y-hw-7*s);g.textAlign='left';
      }
    }
  }

  _dScan(){
    const{g,SX,BY,BH,s}=this;
    const pulse=.5+.5*Math.sin(performance.now()/240);
    const col=`rgba(29,${Math.round(100+80*pulse)},100,${.6+.4*pulse})`;
    g.strokeStyle=col;g.lineWidth=2;g.setLineDash([5*s,3*s]);
    g.beginPath();g.moveTo(SX,BY-BH/2-14*s);g.lineTo(SX,BY+BH/2+14*s);g.stroke();
    g.setLineDash([]);
    g.font=`bold ${9*s}px 'Share Tech Mono',monospace`;
    g.fillStyle=col;g.textAlign='center';
    g.fillText('◆ SCAN',SX,BY-BH/2-18*s);g.textAlign='left';
  }

  _dArm(){
    const{g,SX,BY,BH,s}=this;
    const px=SX+52*s,py=BY+BH/2+6*s,len=48*s;
    const rad=this.aAng*Math.PI/180;
    const ex=px+len*Math.sin(rad),ey=py+len*Math.cos(rad);
    g.save();g.globalAlpha=.2;g.strokeStyle='#000';g.lineWidth=6*s;
    g.beginPath();g.moveTo(px+2,py+2);g.lineTo(ex+2,ey+2);g.stroke();g.restore();
    g.strokeStyle='#ef9f27';g.lineWidth=3.5*s;g.lineCap='round';
    g.beginPath();g.moveTo(px,py);g.lineTo(ex,ey);g.stroke();
    g.fillStyle='#ef9f27';g.beginPath();g.arc(px,py,5*s,0,Math.PI*2);g.fill();
    g.fillStyle='#ffd070';g.beginPath();g.arc(ex,ey,3*s,0,Math.PI*2);g.fill();
    g.lineCap='butt';
  }

  _dBins(){
    const{g,W,BINY,BINW,BINH,s}=this;
    const bins=['recycle','organic','metal','reject'];
    const sp=W/4;
    for(let i=0;i<4;i++){
      const b=bins[i],cx=sp/2+i*sp,cy=BINY;
      const col=BIN_COL[b],dim=BIN_DIM[b];
      // shadow
      g.save();g.globalAlpha=.2;g.fillStyle='#000';
      rr(g,cx-BINW/2+4,cy-BINH/2+4,BINW,BINH,8*s);g.fill();g.restore();
      // fill
      g.fillStyle=dim;rr(g,cx-BINW/2,cy-BINH/2,BINW,BINH,8*s);g.fill();
      // glow border
      g.strokeStyle=col;g.lineWidth=2;rr(g,cx-BINW/2,cy-BINH/2,BINW,BINH,8*s);g.stroke();
      // label
      g.font=`600 ${10.5*s}px Barlow,sans-serif`;g.fillStyle=col;g.textAlign='center';
      g.fillText(BIN_LBL[b],cx,cy-8*s);
      // count
      const cnt=CLASSES.filter(c=>getBin(c)===b).reduce((a,c)=>a+this.pc[c][0],0);
      g.font=`700 ${20*s}px 'Share Tech Mono',monospace`;g.fillStyle='#f0f0eb';
      g.fillText(cnt,cx,cy+14*s);g.textAlign='left';
    }
  }

  _dLog(){
    const{g,s,PY,PH,LW}=this;
    const px=10*s;
    g.fillStyle='#141418';rr(g,px,PY,LW,PH,6*s);g.fill();
    g.strokeStyle='#28283a';g.lineWidth=1;rr(g,px,PY,LW,PH,6*s);g.stroke();
    g.font=`600 ${8.5*s}px Barlow,sans-serif`;g.fillStyle='#44445a';
    g.fillText('VISION PIPELINE LOG',px+10*s,PY+14*s);
    const lines=this.pLog.slice(-5);
    for(let i=0;i<lines.length;i++){
      g.font=`${10*s}px 'Share Tech Mono',monospace`;
      g.fillStyle=i===lines.length-1?'#1d9e75':'#585870';
      g.fillText(lines[i].slice(0,42),px+10*s,PY+28*s+i*16*s);
    }
  }

  _dStats(){
    const{g,s,PY,PH,SX2,W}=this;
    const px=SX2,pw=W-SX2-10*s;
    g.fillStyle='#141418';rr(g,px,PY,pw,PH,6*s);g.fill();
    g.strokeStyle='#28283a';g.lineWidth=1;rr(g,px,PY,pw,PH,6*s);g.stroke();
    const acc=this.correct/Math.max(this.total,1)*100;
    const ac=acc>75?'#1d9e75':acc>55?'#ef9f27':'#e24b4a';
    const stats=[['Score',this.score,'#f0f0eb'],['Accuracy',acc.toFixed(1)+'%',ac],
                 ['Streak',this.streak,'#ef9f27'],['Sorted',`${this.total}/${this.batch.length}`,'#6a6a7a']];
    const hw=pw/2;
    for(let i=0;i<4;i++){
      const[lbl,val,col]=stats[i];
      const ox=px+(i%2)*hw+10*s,oy=PY+Math.floor(i/2)*(PH/2)+13*s;
      g.font=`${8.5*s}px Barlow,sans-serif`;g.fillStyle='#44445a';g.fillText(lbl,ox,oy);
      g.font=`700 ${17*s}px Barlow,sans-serif`;g.fillStyle=col;g.fillText(val,ox,oy+17*s);
    }
  }

  _dFb(){
    const{g,s}=this;
    for(const f of this.fb){
      if(f.a<=0)continue;
      g.save();g.globalAlpha=f.a;
      g.font=`700 ${15*s}px Barlow,sans-serif`;g.fillStyle=f.color;g.textAlign='center';
      g.fillText(f.text,f.x,f.y+f.dy);g.restore();
    }
    g.textAlign='left';
  }

  _dHint(){
    const{g,W,H,s}=this;
    g.font=`${8.5*s}px 'Share Tech Mono',monospace`;g.fillStyle='#30303a';
    g.textAlign='right';
    g.fillText('SPACE pause · 1-5 speed · Q quit',W-10*s,H-7*s);
    g.textAlign='left';
  }

  _end(){
    this.stop();
    document.getElementById('end-score').textContent=this.score;
    document.getElementById('es-sorted').textContent=this.total;
    document.getElementById('es-acc').textContent=(this.correct/Math.max(this.total,1)*100).toFixed(1)+'%';
    document.getElementById('es-streak').textContent=this.best;
    document.getElementById('es-lat').textContent=this.pipe.avgLat()+'ms';
    const grid=document.getElementById('per-class-grid');grid.innerHTML='';
    for(const cls of CLASSES){
      const[c,t]=this.pc[cls];if(!t)continue;
      const pct=Math.round(c/t*100),bc=pct>75?'#1d9e75':pct>50?'#ef9f27':'#e24b4a';
      const row=document.createElement('div');row.className='cls-row';
      row.innerHTML=`<span class="cls-name">${cls}</span><div class="cls-bar-bg"><div class="cls-bar" style="width:${pct}%;background:${bc}"></div></div><span class="cls-pct">${pct}%</span>`;
      grid.appendChild(row);
    }
    document.getElementById('game-wrap').classList.remove('active');
    document.getElementById('end-screen').classList.add('active');
  }
}

// ═══════════════════════════════════════════════
// MENU
// ═══════════════════════════════════════════════
const opts={classifier:'color',beltSpeed:2,noiseLevel:0,batchSize:40};
let G=null;
['clf-opts','speed-opts','noise-opts','batch-opts'].forEach((id,i)=>{
  const key=['classifier','beltSpeed','noiseLevel','batchSize'][i];
  document.getElementById(id).addEventListener('click',e=>{
    const b=e.target.closest('.opt-btn');if(!b)return;
    document.querySelectorAll(`#${id} .opt-btn`).forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    opts[key]=isNaN(+b.dataset.val)?b.dataset.val:+b.dataset.val;
  });
});
document.getElementById('start-btn').addEventListener('click',()=>{
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('game-wrap').classList.add('active');
  document.getElementById('end-screen').classList.remove('active');
  document.getElementById('pause-overlay').classList.remove('active');
  const cv=document.getElementById('canvas');
  if(G)G.stop();
  G=new Game(cv,{...opts});G.start();
});
document.getElementById('restart-btn').addEventListener('click',()=>{
  document.getElementById('end-screen').classList.remove('active');
  document.getElementById('menu').classList.remove('hidden');
});
</script>
